<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#2A2521" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.json" />
		<script>
			window.__catersyncDeferredInstallPrompt = null;
			window.__catersyncInstallPromptSeen = false;
			window.addEventListener('beforeinstallprompt', function (event) {
				event.preventDefault();
				window.__catersyncDeferredInstallPrompt = event;
				window.__catersyncInstallPromptSeen = true;
				window.dispatchEvent(new CustomEvent('catersync-install-prompt-ready'));
			});
			window.addEventListener('appinstalled', function () {
				window.__catersyncDeferredInstallPrompt = null;
				window.__catersyncInstallPromptSeen = false;
			});
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=IBM+Plex+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="font-body antialiased bg-[#F6F2EA] text-[#2A2521]">
		<!-- Initial PWA App Loading Screen -->
		<div id="pwa-loading-screen" style="position: fixed; inset: 0; background-color: #F6F2EA; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; transition: opacity 0.4s ease, visibility 0.4s ease;">
			<div style="border: 2px solid #2A2521; padding: 12px 24px; font-weight: 900; letter-spacing: -0.05em; font-size: 1.5rem; text-transform: uppercase; margin-bottom: 16px; animation: pulse 1.5s infinite ease-in-out;">
				THE PASS
			</div>
			<div style="font-size: 9px; letter-spacing: 0.2em; color: #767068; text-transform: uppercase; margin-bottom: 8px;">
				Initializing Operations Roster
			</div>
			<!-- Simulating receipt style dotted loader -->
			<div style="width: 140px; height: 1px; border-top: 2px dotted #767068; margin-bottom: 12px;"></div>
			<div id="pwa-loading-percentage" style="font-size: 10px; font-weight: bold; color: #2A2521; font-variant-numeric: tabular-nums;">0%</div>
		</div>

		<div style="display: contents">%sveltekit.body%</div>

		<style>
			@keyframes pulse {
				0%, 100% { transform: scale(1); opacity: 1; }
				50% { transform: scale(0.96); opacity: 0.85; }
			}
		</style>
	</body>
</html>
