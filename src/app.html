<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#2A2521" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.json" />
		<script>
			window.__catersyncDeferredInstallPrompt = null;
			window.__catersyncInstallPromptSeen = false;
			window.addEventListener('beforeinstallprompt', function (event) {
				event.preventDefault();
				window.__catersyncDeferredInstallPrompt = event;
				window.__catersyncInstallPromptSeen = true;
				window.dispatchEvent(new CustomEvent('catersync-install-prompt-ready'));
			});
			window.addEventListener('appinstalled', function () {
				window.__catersyncDeferredInstallPrompt = null;
				window.__catersyncInstallPromptSeen = false;
			});
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=IBM+Plex+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="font-body antialiased bg-[#F6F2EA] text-[#2A2521]">
		<!-- Initial PWA App Loading Screen -->
		<div id="pwa-loading-screen" style="position: fixed; inset: 0; background-color: #e8e4de; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s ease;">
			<video
				autoplay
				muted
				loop
				playsinline
				style="width: 260px; height: 260px; object-fit: contain; display: block; mix-blend-mode: multiply; -webkit-mask-image: radial-gradient(circle, black 52%, transparent 68%); mask-image: radial-gradient(circle, black 52%, transparent 68%); overflow: hidden;"
			>
				<source src="/loader.mp4" type="video/mp4" />
			</video>
		</div>

		<div style="display: contents">%sveltekit.body%</div>


	</body>
</html>
