name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  django-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: catersync_ai
          POSTGRES_USER: catersync_user
          POSTGRES_PASSWORD: catersync_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: catersync-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Django checks
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          DB_NAME: catersync_ai
          DB_USER: catersync_user
          DB_PASSWORD: catersync_password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: |
          python manage.py check
          python manage.py migrate --noinput
