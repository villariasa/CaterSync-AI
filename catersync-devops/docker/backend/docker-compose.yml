services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: catersync_ai
      POSTGRES_USER: catersync_user
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
  backend:
    build:
      context: ../..
      dockerfile: catersync-devops/docker/backend/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8000:8000"
