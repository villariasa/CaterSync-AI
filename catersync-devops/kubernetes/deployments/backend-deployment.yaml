apiVersion: apps/v1
kind: Deployment
metadata:
  name: catersync-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catersync-backend
  template:
    metadata:
      labels:
        app: catersync-backend
    spec:
      containers:
        - name: backend
          image: catersync-backend:latest
          ports:
            - containerPort: 8000
